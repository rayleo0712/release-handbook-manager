<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="1216" y2="592" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="200" y1="120" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="760" y1="120" x2="1080" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="accent-arrow" x1="520" y1="300" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1232" height="592" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="592" rx="28" stroke="#334155" stroke-width="2"/>

  <g opacity="0.1">
    <path d="M92 118H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M92 202H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M92 286H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M92 370H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M92 454H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M92 538H1188" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 10"/>
  </g>

  <!-- 标题区 -->
  <text x="88" y="84" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">AI 发布治理组合套件</text>
  <text x="88" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">真源治理 + 自动化测试，双工具闭环解决 AI 开发升级容易崩溃的问题</text>

  <!-- 左侧卡片：rhm 真源治理 -->
  <g filter="url(#shadow)">
    <rect x="84" y="152" width="470" height="388" rx="24" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B"/>
    <rect x="84" y="152" width="470" height="56" rx="24" fill="url(#accent-blue)" fill-opacity="0.12"/>
    <path d="M84 152H554" stroke="url(#accent-blue)" stroke-width="2"/>

    <text x="120" y="190" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">① 真源治理（负责把升级清单整理好）</text>

    <text x="120" y="254" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">rhm</text>
    <text x="120" y="284" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">release-handbook-manager</text>

    <text x="120" y="336" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 版本号人工把关（AI 不会乱改）</text>
    <text x="120" y="370" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 更新手册 + SQL/配置脚本</text>
    <text x="120" y="404" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 脚本自带成功校验语句</text>
    <text x="120" y="438" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 发布清单 + 技术验证 + 更新日志</text>
    <text x="120" y="472" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 非技术版功能验收用例（05-1）</text>
    <text x="120" y="506" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">产出：升级照着做就不会错</text>
  </g>

  <!-- 中间协同箭头与闭环标识 -->
  <g>
    <!-- 双向箭头：rhm 真源 -> rta 执行 -->
    <path d="M554 316 L594 316" stroke="url(#accent-arrow)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="594,316 582,308 582,324" fill="#34D399"/>
    <!-- 逆向：rta 回填 -> rhm 归档 -->
    <path d="M594 356 L554 356" stroke="url(#accent-arrow)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="554,356 566,348 566,364" fill="#22D3EE"/>

    <text x="546" y="274" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">真源输入</text>
    <text x="546" y="396" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">结果回填</text>

    <!-- 闭环标识圆圈 -->
    <circle cx="574" cy="316" r="52" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
    <text x="574" y="322" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">闭环</text>
  </g>

  <!-- 右侧卡片：rta 自动化测试 -->
  <g filter="url(#shadow)">
    <rect x="726" y="152" width="470" height="388" rx="24" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B"/>
    <rect x="726" y="152" width="470" height="56" rx="24" fill="url(#accent-green)" fill-opacity="0.12"/>
    <path d="M726 152H1196" stroke="url(#accent-green)" stroke-width="2"/>

    <text x="762" y="190" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">② 自动化测试（负责照着清单自动验）</text>

    <text x="762" y="254" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">rta</text>
    <text x="762" y="284" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">release-test-auto</text>

    <text x="762" y="336" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 读取 05-1 验收用例自动生成脚本</text>
    <text x="762" y="370" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 终端独立运行，不依赖聊天在线</text>
    <text x="762" y="404" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 断点续跑（掉线了接着跑）</text>
    <text x="762" y="438" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 正向 + 逆向双覆盖</text>
    <text x="762" y="472" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22">· 修完 bug 重启服务续跑</text>
    <text x="762" y="506" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">产出：自动验收结果 + 归档报告</text>
  </g>

  <!-- 底部说明 -->
  <text x="88" y="592" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="22">面向 AI 协作开发的发布治理双工具组合套件 —— 从「凭经验升级」到「按清单升级 + 自动验收」</text>
</svg>
